[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptofv"
version = "0.4.0"
description = "Fair value measurement, journal entries and disclosures for crypto assets under ASC 350-60 and ASC 820"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []
keywords = ["accounting", "crypto", "fair value", "ASC 350-60", "ASC 820", "US GAAP"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
cryptofv = "cryptofv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cryptofv = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
